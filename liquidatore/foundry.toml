[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# LE PROVE DEVONO POTER LEGGERE LA CALLDATA VERA. Senza questo permesso una
# prova non puo' attraversare cio' che spediamo davvero, e una prova che
# costruisce i suoi dati in Solidity non ha mai visto i nostri byte: e'
# esattamente il buco in cui e' vissuto il selettore sbagliato.
# L'OTTIMIZZATORE SERVE DAVVERO, non e' una preferenza: senza, una prova
# sfora la pila ("stack too deep") e TUTTA la compilazione si ferma, quindi
# nessuna prova gira -- e una prova che non gira e' un controllo che non c'e'.
# E il contratto distribuito ne esce piu' piccolo, cioe' costa meno gas.
optimizer = true
optimizer_runs = 200

fs_permissions = [{ access = "read", path = "./dati" }]
