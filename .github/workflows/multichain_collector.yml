name: multichain_collector
# MULTICHAIN_COLLECTOR: espande l'accumulo a Solana/BSC/Base/Robinhood via GeckoTerminal (round-robin,
# 1 chain per run). Risolve il collo di bottiglia dati. Candele orarie + pool memecoin per chain. €0.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: multichain_collector
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python agents/multichain_collector.py || echo "ko"
      - name: Salva
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/multichain 2>/dev/null || true
          git commit -m "multichain $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3; do git pull --no-rebase --no-edit -X ours origin main || true; git push origin main && exit 0; sleep 4; done
