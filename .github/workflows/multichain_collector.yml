name: multichain_collector
# A RIPOSO DAL 30/09. Non gira dal 27 agosto — trentaquattro giorni — e nessuno se n'e' accorto:
# la raccolta multichain la fanno hook, scoperta, vivo e censimento.
# Stavo per rianimarla aggiungendole il riarmo, prima di chiedermi se serviva ancora. Non serve.
#
# NON e' cancellata: il codice resta e si lancia a mano da GitHub quando serve. Spento solo
# l'orologio, perche' una corsia che gira senza che nessuno legga il suo risultato consuma uno dei
# venti posti macchina e produce rumore nei registri — e il rumore nasconde i guasti veri.
# POTENZIATO: 4 chain IN PARALLELO (matrix). Ogni job = 1 chain su un runner con IP diverso -> 4x throughput
# (GeckoTerminal limita per-IP). Candele orarie + pool memecoin per chain. Ogni 20 min. €0.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chain: [solana, bsc, base, robinhood]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: mc-${{ matrix.chain }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Raccogli ${{ matrix.chain }}
        env:
          CHAIN: ${{ matrix.chain }}
        run: python agents/multichain_collector.py || echo "ko"
      - name: Salva (push robusto anti-collisione)
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/multichain/${{ matrix.chain }} 2>/dev/null || true
          git commit -m "multichain ${{ matrix.chain }} $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3 4 5 6; do
            { git fetch --deepen 50 -q origin main 2>/dev/null || true; git pull --rebase --autostash -q origin main || git pull --no-rebase --no-edit --allow-unrelated-histories -X ours origin main; } || true
            git push origin main && { echo pushed; exit 0; }
            sleep $((RANDOM % 8 + 3))
          done
          exit 0
