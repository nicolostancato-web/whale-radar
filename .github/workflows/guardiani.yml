name: guardiani
# I GUARDIANI NON DEVONO DIPENDERE DAL LOOP 0 (21/09).
# Il 17/09 abbiamo spento il loop 0 per concentrare tutto sul database. Dentro il loop 0 però
# giravano anche i guardiani — e sono andati giu' con lui, senza che nessuno se ne accorgesse:
# SECURITY.md e CFO.md sono rimasti fermi al 17/09 alle 18:23, cioè QUATTRO GIORNI.
# Quattro giorni senza il controllo delle credenziali su un repo PUBBLICO, e senza il controllo
# dei costi proprio mentre aprivamo una spesa a consumo su OpenAI.
#
# Nessuno l'ha visto perche' l'allarme era sepolto sotto 36 falsi allarmi dello stesso cruscotto.
# Separare lo spento dal rotto non era cosmetica: e' servito a far emergere questo.
#
# Qui girano da soli, indipendenti da tutto il resto. Costano zero: uno non fa chiamate di rete,
# l'altro interroga solo l'API di GitHub.
on:
  workflow_dispatch:
  schedule:
      # L'OROLOGIO E' UNA RETE, NON UN MOTORE (30/09). Suonava ogni 20-30 minuti mentre il
      # riarmo teneva la corsia gia' in movimento: ogni suonata finiva in coda e veniva
      # ANNULLATA. Misurato: 36 cancellazioni su 73 giri, tutte inutili, e il rumore nascondeva
      # le cancellazioni vere (i giri uccisi dal tempo massimo).
      # Ora suona una volta all'ora: se la catena del riarmo si rompe, riparte da qui.
    - cron: "17 */3 * * *"   # girava ogni tre ore ed e' sufficiente

concurrency:
  group: guardiani
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  guardia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # LA SICUREZZA PER PRIMA, E SE FALLISCE SI SENTE. Il repo e' pubblico: una credenziale
      # finita qui dentro e' pubblica nel momento stesso in cui viene spinta.
      - name: Credenziali nel repo pubblico
        run: python agents/team_security.py

      - name: Costi
        if: always()
        run: python agents/team_cfo.py

      - name: Salva
        if: always()
        run: |
          git config user.name "whale-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git commit -m "guardiani $(date -u +%H:%MZ)"; then
            echo "NIENTE DA SALVARE"; exit 0
          fi
          for i in 1 2 3 4 5; do
            # SI RIPARTE DALLO STATO DEL SERVER, NON SI TENTA DI RICONCILIARE (28/09).
            # Qui c'era un `git pull` col fallimento SILENZIATO. Misurato oggi su storico, vivo,
            # guardiani, previsioni: il push veniva rifiutato con «fetch first» a ogni tentativo,
            # per due ore e mezza, e il motivo non compariva da nessuna parte perche' l'avevo
            # nascosto io. La copia del runner e' superficiale (`checkout` prende un commit solo) e
            # la storia a monte viene riscritta dal compattatore: in quelle condizioni il pull non
            # ha niente a cui agganciarsi, e nessun numero di tentativi lo supera.
            # Si mettono da parte i file prodotti, ci si allinea al server, si rimettono, si spinge.
            # Funziona perche' ogni corsia scrive le SUE cartelle: rimetterle sopra lo stato nuovo
            # non puo' cancellare il lavoro di un'altra.
            rm -rf /tmp/prodotti && mkdir -p /tmp/prodotti
            git status --porcelain -- data | awk '{print $NF}' | while read F; do
              [ -f "$F" ] && mkdir -p "/tmp/prodotti/$(dirname "$F")" && cp "$F" "/tmp/prodotti/$F"
            done
            git fetch --depth 20 -q origin main && git reset --hard -q FETCH_HEAD
            (cd /tmp/prodotti && find . -type f | sed "s|^\./||") | while read F; do
              mkdir -p "$(dirname "$F")" && cp "/tmp/prodotti/$F" "$F"
            done
            git add -A data
            git commit -q -m "guardiani $(date -u +%H:%MZ)" 2>/dev/null || true
            if git push origin main; then echo "spinto al tentativo $i"; exit 0; fi
            sleep $((RANDOM % 20 + 5))
          done
          echo "NON SONO RIUSCITO A SPINGERE"; exit 1
      - name: Riarmo
        # Trovata dalla porta mentre riparavo il salvataggio: aveva solo il cron, e GitHub lo salta
        # sui repository occupati. Una corsia che sorveglia gli altri e non gira e' peggio di niente,
        # perche' il suo silenzio viene letto come «tutto bene».
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 300
          # NON CHIEDERE SE C'E' GIA' QUALCUNO IN CODA (30/09, propagato dall'insieme).
          # La coda di GitHub tiene UN giro in attesa: chi arriva dopo viene annullato. Misurato
          # stanotte: 55 giri annullati su 71. Non si perde lavoro — ne resta sempre uno — ma il
          # registro diventa illeggibile, e le cancellazioni finte NASCONDONO quelle vere: i tre
          # giri uccisi dal tempo massimo li ho trovati per caso, in mezzo a questo rumore.
          IN_CODA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/guardiani.yml/runs?per_page=20" \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['workflow_runs']; print(sum(1 for r in d if r['status'] in ('queued','pending','in_progress')))" 2>/dev/null || echo 0)
          if [ "${IN_CODA:-0}" -gt 0 ]; then
            echo "c'e' gia' un giro in coda ($IN_CODA): non ne aggiungo un altro"
            exit 0
          fi
          for TENT in 1 2 3 4 5; do
            CODICE=$(curl -s -o /tmp/r.out -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/guardiani.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$CODICE" = "204" ]; then echo "riarmato (tentativo $TENT)"; exit 0; fi
            case "$CODICE" in
              5*|429|000) sleep $((TENT * 20)) ;;
              *) echo "rifiuto definitivo (HTTP $CODICE)"; cat /tmp/r.out; exit 1 ;;
            esac
          done
          echo "NON SONO RIUSCITO A RIARMARMI"; exit 1
