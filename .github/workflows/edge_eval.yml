name: edge_eval
# EDGE_EVAL: lo strumento del loop. Ogni giorno misura il walk-forward ONESTO (no-lookahead) e logga
# l'edge nel tempo in EDGE.md + data/edge_history.jsonl. Vediamo l'ago muoversi verso il goal. €0.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "31 */4 * * *"
permissions:
  contents: write
concurrency:
  group: edge_eval
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python agents/edge_eval.py || echo "ko"
      - name: Salva
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add EDGE.md data/edge_history.jsonl 2>/dev/null || true
          git commit -m "edge_eval $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3; do git pull --no-rebase --no-edit -X ours origin main || true; git push origin main && exit 0; sleep 4; done
