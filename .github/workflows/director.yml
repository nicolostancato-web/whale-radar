name: director
# DIRECTOR: il regista del loop auto-alimentante. Ogni ora: se e' ora, lancia l'analisi (Fase 2),
# registra i gap da colmare (Fase 1), aggiorna state.json e STATE.md (pannello 'news?'). €0.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 * * * *"   # ogni ora, a :05
permissions:
  contents: write
concurrency:
  group: director
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python agents/director.py || echo "ko, riprovo al prossimo giro"
      - name: Salva stato + report
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json STATE.md metrics.json directives.json analysis_report.md 2>/dev/null || true
          git commit -m "director $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3; do
            git pull --no-rebase --no-edit -X ours origin main || true
            git push origin main && exit 0; sleep 4
          done
          exit 0
