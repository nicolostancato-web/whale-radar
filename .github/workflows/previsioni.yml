name: previsioni
# L'OROLOGIO DEL LOOP 1 (22/09). Scrive previsioni oggi, che verranno giudicate domani.
# Non compra niente e non decide niente: scrive righe in un registro. Il costo di sbagliarsi e'
# una riga sbagliata in un file.
#
# PARTE PRIMA CHE LA MACCHINA SIA RIFINITA, di proposito: le previsioni non si accumulano da sole,
# si accumulano da quando si comincia a scriverle. Ne servono centinaia per dire qualcosa, e ogni
# giorno passato ad aspettare la perfezione e' un giorno che non si recupera.
# Il rigore non cambia: le ipotesi sono in IPOTESI.md, scritte prima, ognuna con la condizione che
# la ucciderebbe. Cambia solo quando parte l'orologio.
on:
  workflow_dispatch:
  schedule:
      # L'OROLOGIO E' UNA RETE, NON UN MOTORE (30/09). Suonava ogni 20-30 minuti mentre il
      # riarmo teneva la corsia gia' in movimento: ogni suonata finiva in coda e veniva
      # ANNULLATA. Misurato: 36 cancellazioni su 73 giri, tutte inutili, e il rumore nascondeva
      # le cancellazioni vere (i giri uccisi dal tempo massimo).
      # Ora suona una volta all'ora: se la catena del riarmo si rompe, riparte da qui.
      # L'OROLOGIO OGNI SEI ORE, NON OGNI ORA (30/09). Con il riarmo che funziona, ogni suonata
      # dell'orologio arriva mentre la corsia sta gia' lavorando: finisce in coda e viene
      # annullata. Diciassette corsie per ventiquattro suonate fanno quattrocento cancellazioni
      # al giorno, e il rumore nasconde le cancellazioni vere.
      # Resta come RETE: se la catena del riarmo si spezza, entro sei ore riparte.
      # LA RETE DEVE ESSERE PIU' STRETTA DEL BUCO (30/09, imparata a caro prezzo).
      # Stamattina ho portato questo orologio da un'ora a sei, ragionando che col riarmo
      # funzionante le suonate erano solo rumore. Ma un giro ANNULLATO non esegue il passo di
      # riarmo: la catena si spezza, e l'unica cosa che puo' riprenderla e' l'orologio.
      # Alle 11:53 hook, scoperta e censimento sono stati annullati insieme. Sono rimasti fermi
      # TRE ORE E MEZZA — raccolta dati e pubblicazione bloccate — perche' la rete successiva
      # era a sei ore di distanza.
      # Una rete piu' larga dell'intervallo in cui il guasto si presenta non e' una rete.
    - cron: "42 * * * *"      # rete di sicurezza: i cron vengono saltati sui repo occupati

concurrency:
  group: previsioni
  cancel-in-progress: false

permissions:
  contents: write
  # SERVE ANCHE `actions: write` PER POTERSI RIARMARE (22/09). Senza, la chiamata che rilancia la
  # corsia viene rifiutata subito — il riarmo e' fallito in 3 secondi al primo giro, e le corsie
  # che funzionano da giorni ce l'hanno tutte. Il ciclo dei tentativi ha fatto la cosa giusta:
  # ha riconosciuto un rifiuto DEFINITIVO e non ha insistito cinque volte per niente.
  actions: write

jobs:
  prevedi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chain: [base, robinhood]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Scrivi le previsioni e chiudi quelle scadute
        env:
          CHAIN: ${{ matrix.chain }}
          FINESTRA_ORE: "6"
          MAX_PER_GIRO: "80"
        run: python agents/previsioni.py

      - name: Consegna senza toccare il ramo
        # NON SPINGE PIU' (29/09). Con cinquantuno corsie che scrivevano su `main`, questa perdeva
        # la gara, moriva dopo venti tentativi e mandava una email di guasto al fondatore per un
        # problema che non era suo. Oggi ha generato 21 fallimenti.
        # Ora consegna in un pacco `consegna-*`: il pubblicatore li raccoglie tutti ed e' l'unico
        # a scrivere. E' la stessa correzione gia' fatta per l'insieme e per i raccoglitori.
        if: always()
        run: |
          # SOLO I FILE CAMBIATI (29/09). Consegnare tutta `data` vorrebbe dire spedire il
          # repository intero a ogni giro: gigabyte di roba gia' su GitHub, per salvare qualche
          # decina di file nuovi. Si mette da parte solo cio' che questa corsia ha toccato.
          rm -rf /tmp/consegna && mkdir -p /tmp/consegna
          git status --porcelain -- data | awk '{print $NF}' | while read F; do
            [ -f "$F" ] && mkdir -p "/tmp/consegna/$(dirname "$F")" && cp "$F" "/tmp/consegna/$F"
          done
          N=$(find /tmp/consegna -type f | wc -l)
          echo "consegno $N file"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consegna-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}
          path: /tmp/consegna/data
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
      - name: Riarmo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # UN GIRO CHE MUORE SUBITO NON SI RIARMA A RAFFICA (26/09). Questa guardia esisteva dal
          # 16/09 nelle corsie col riarmo dentro il lavoro, e in QUESTE — dove il riarmo e' un
          # lavoro separato — non era mai stata messa. Misurato stasera su `scoperta`: giri ogni
          # NOVANTA SECONDI, perche' il lavoro falliva in fretta e il riarmo ripartiva subito.
          # Una corsia rotta che si rilancia all'infinito occupa i posti macchina di tutte le
          # altre: il guasto di una diventa il rallentamento di tutte.
          # IN POSITIVO: **quando qualcosa fallisce, si riprova piu' piano, non piu' in fretta.**
          if [ "${{ needs.prevedi.result }}" != "success" ]; then
            echo "il lavoro non e' riuscito: aspetto 10 minuti prima di riarmare"
            sleep 600
          else
            sleep 60
          fi
          # RIARMO: SI RIPROVA (22/09). Un rifiuto passeggero del server spegneva le corsie per
          # ore. Solo un rifiuto definitivo e' un no vero.
          # NON CHIEDERE SE C'E' GIA' QUALCUNO IN CODA (30/09, propagato dall'insieme).
          # La coda di GitHub tiene UN giro in attesa: chi arriva dopo viene annullato. Misurato
          # stanotte: 55 giri annullati su 71. Non si perde lavoro — ne resta sempre uno — ma il
          # registro diventa illeggibile, e le cancellazioni finte NASCONDONO quelle vere: i tre
          # giri uccisi dal tempo massimo li ho trovati per caso, in mezzo a questo rumore.
          # VENTI POSTI MACCHINA, NON DI PIU' (30/09). Stanotte ho aggiunto il riarmo a
          # diciannove corsie: risultato, venti giri in esecuzione e diciannove in coda, con
          # cancellazioni a raffica. E' lo stesso errore del 25/09 — il riarmo su troppe corsie
          # affama quelle critiche — in forma nuova. Chi non e' critico aspetta mezz'ora.
          sleep 1800
          IN_CODA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/previsioni.yml/runs?per_page=20" \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['workflow_runs']; print(sum(1 for r in d if r['status'] in ('queued','pending','in_progress')))" 2>/dev/null || echo 0)
          if [ "${IN_CODA:-0}" -gt 0 ]; then
            echo "c'e' gia' un giro in coda ($IN_CODA): non ne aggiungo un altro"
            exit 0
          fi
          for TENT in 1 2 3 4 5; do
            CODICE=$(curl -s -o /tmp/r.out -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/previsioni.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$CODICE" = "204" ]; then echo "riarmata (tentativo $TENT)"; exit 0; fi
            echo "riarmo respinto (HTTP $CODICE), tentativo $TENT"
            case "$CODICE" in
              5*|429|000) sleep $((TENT * 15)) ;;
              *) echo "rifiuto definitivo"; cat /tmp/r.out; exit 1 ;;
            esac
          done
          echo "NON SONO RIUSCITO A RIARMARMI dopo 5 tentativi"; exit 1
