name: censimento
# IL CENSIMENTO — l'universo vero, e il collo di bottiglia del gate.
#
# PERCHE' UNA CORSIA SUA (18/09). Il censimento e' il DENOMINATORE di tutto: finche' non e'
# completo, «copertura 84%» divide per il nostro stesso registro — una lista che abbiamo scelto
# noi, che puo' salire al 100% mentre la realta' peggiora. E' il rilievo numero uno della
# revisione esterna, e nessuna delle sette condizioni si puo' chiudere prima.
# Dentro la corsia database riceveva 200 secondi per giro, divisi fra due chain, e robinhood fa
# una chiamata ogni 8 secondi perche' i suoi blocchi sono fittissimi di scambi: significa 25
# chiamate per giro su 859 necessarie. Non era ferma, era affamata.
# Adesso che loop 0 e loop 1 sono spenti ci sono sedici slot liberi: tanto vale usarli per la
# cosa che blocca tutto il resto.
#
# L'INTERVALLO E' GIA' DICHIARATO nel segnalibro e NON si sposta: se lo ricalcolasse seguendo la
# punta non finirebbe mai, e il denominatore cambierebbe sotto i piedi a chi lo usa.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "3,33 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: censimento
  cancel-in-progress: false
jobs:
  censisci:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chain: [robinhood, base]
    steps:
      - uses: actions/checkout@v4
      - name: Segna l'inizio
        run: date +%s > /tmp/inizio_giro
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Censimento
        env:
          CHAIN: ${{ matrix.chain }}
          BUDGET_SEC: "3300"
        run: python agents/censimento.py
      - name: Salva
        run: |
          git config user.name "whale-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/multichain
          if ! git commit -m "censimento ${{ matrix.chain }} $(date -u +%H:%MZ)"; then
            echo "niente di nuovo"; exit 0
          fi
          # IL PULL NON DEVE UCCIDERE IL SALVATAGGIO (22/09). Il passo gira con `bash -e`: un
          # comando che fallisce interrompe tutto. Il `git pull` dentro il ciclo dei tentativi era
          # nudo, quindi al primo intoppo la shell moriva e i DIECI TENTATIVI NON VENIVANO MAI
          # FATTI — con un messaggio che diceva «la riparazione di questa chain va persa», e
          # infatti andava persa davvero.
          # Misurato il 22/09: sei operai su sei falliti allo stesso modo, commit da 615 file
          # buttato, mezz'ora di lavoro di tutta la corsia persa.
          for i in $(seq 1 20); do   # 23/09: dieci non bastavano, i giri venivano buttati
            git pull --no-rebase --no-edit -X ours origin main >/dev/null 2>&1 || true
            if git push origin main; then echo "spinto al tentativo $i"; exit 0; fi
            sleep $((RANDOM % 15 + 5))
          done
          echo "NON SONO RIUSCITO A SPINGERE: il censimento resta sul runner."
          exit 1
      - name: Riarmo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DURATA=$(( $(date +%s) - $(cat /tmp/inizio_giro 2>/dev/null || echo 0) ))
          if [ "$DURATA" -lt 300 ]; then
            # UNA GUARDIA NON DEVE UCCIDERE CIO' CHE SORVEGLIA (21/09). Serviva a non ripartire a
            # raffica se la corsia falliva in pochi secondi. Ma «non mi riarmo» voleva dire che la
            # corsia MORIVA, e il cron non la recuperava: GitHub salta i cron sui repo occupati, e
            # il nostro lo e' sempre. La corsia popolazione e' rimasta ferma QUATTRO ORE cosi',
            # col registro che diceva «success».
            echo "SOLO ${DURATA}s: aspetto 5 minuti prima di riarmarmi, cosi' non parto a raffica."
            sleep 300
          fi
          # RIARMO: SI RIPROVA (22/09). Un rifiuto passeggero del server di GitHub spegneva la
          # corsia per ore — successo alle 02:33 su `popolazione`, con tutti i lavori riusciti.
          for TENT in 1 2 3 4 5; do
            CODICE=$(curl -s -o /tmp/r.out -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/censimento.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$CODICE" = "204" ]; then echo "riarmata dopo ${DURATA}s (tentativo $TENT)"; exit 0; fi
            echo "riarmo respinto (HTTP $CODICE), tentativo $TENT"
            case "$CODICE" in
              5*|429|000) sleep $((TENT * 15)) ;;
              *) echo "rifiuto definitivo"; cat /tmp/r.out; exit 1 ;;
            esac
          done
          echo "NON SONO RIUSCITO A RIARMARMI dopo 5 tentativi"; exit 1

  riarmo:
    needs: censisci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Riarmo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # RIARMO (25/09). GitHub SALTA i cron sui repository occupati, e il nostro lo e' sempre.
          # Misurato: le corsie CON riarmo hanno girato 13-16 volte, quelle senza 1-4.
          # «nascite» aveva girato UNA volta sola. Il meccanismo esisteva dal 22/09 su otto corsie
          # e non era stato propagato: e' la condizione 2 della regola di auto-apprendimento —
          # propagare il miglioramento a TUTTI i pezzi simili, non solo dove e' emerso.
          sleep 120
          for TENT in 1 2 3 4 5; do
            CODICE=$(curl -s -o /tmp/r.out -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/censimento.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$CODICE" = "204" ]; then echo "riarmata (tentativo $TENT)"; exit 0; fi
            echo "riarmo respinto (HTTP $CODICE), tentativo $TENT"
            case "$CODICE" in
              5*|429|000) sleep $((TENT * 15)) ;;
              *) echo "rifiuto definitivo"; cat /tmp/r.out; exit 1 ;;
            esac
          done
          echo "NON SONO RIUSCITO A RIARMARMI dopo 5 tentativi"; exit 1
