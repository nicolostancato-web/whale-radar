name: censimento
# IL CENSIMENTO — l'universo vero, e il collo di bottiglia del gate.
#
# PERCHE' UNA CORSIA SUA (18/09). Il censimento e' il DENOMINATORE di tutto: finche' non e'
# completo, «copertura 84%» divide per il nostro stesso registro — una lista che abbiamo scelto
# noi, che puo' salire al 100% mentre la realta' peggiora. E' il rilievo numero uno della
# revisione esterna, e nessuna delle sette condizioni si puo' chiudere prima.
# Dentro la corsia database riceveva 200 secondi per giro, divisi fra due chain, e robinhood fa
# una chiamata ogni 8 secondi perche' i suoi blocchi sono fittissimi di scambi: significa 25
# chiamate per giro su 859 necessarie. Non era ferma, era affamata.
# Adesso che loop 0 e loop 1 sono spenti ci sono sedici slot liberi: tanto vale usarli per la
# cosa che blocca tutto il resto.
#
# L'INTERVALLO E' GIA' DICHIARATO nel segnalibro e NON si sposta: se lo ricalcolasse seguendo la
# punta non finirebbe mai, e il denominatore cambierebbe sotto i piedi a chi lo usa.
on:
  workflow_dispatch: {}
  schedule:
      # L'OROLOGIO E' UNA RETE, NON UN MOTORE (30/09). Suonava ogni 20-30 minuti mentre il
      # riarmo teneva la corsia gia' in movimento: ogni suonata finiva in coda e veniva
      # ANNULLATA. Misurato: 36 cancellazioni su 73 giri, tutte inutili, e il rumore nascondeva
      # le cancellazioni vere (i giri uccisi dal tempo massimo).
      # Ora suona una volta all'ora: se la catena del riarmo si rompe, riparte da qui.
    - cron: "3 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: censimento
  cancel-in-progress: false
jobs:
  censisci:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chain: [robinhood, base]
    steps:
      - uses: actions/checkout@v4
      - name: Segna l'inizio
        run: date +%s > /tmp/inizio_giro
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Censimento
        env:
          CHAIN: ${{ matrix.chain }}
          # BUDGET AL 60% DEL TETTO (1/10). Era 55 min su un tetto di 70 (78%): il lavoro
          # si fermava in tempo ma non restava spazio per salvare e consegnare, e il giro
          # veniva annullato per tempo scaduto con tutto dentro. Trovato da
          # agents/budget_e_tetto.py, che adesso boccia la pubblicazione se qualcuno ci torna.
          BUDGET_SEC: "2520"
        run: python agents/censimento.py
      - name: Consegna senza toccare il ramo
        # NON SPINGE PIU' (29/09). Con cinquantuno corsie che scrivevano su `main`, questa perdeva
        # la gara, moriva dopo venti tentativi e mandava una email di guasto al fondatore per un
        # problema che non era suo. Oggi ha generato 7 fallimenti.
        # Ora consegna in un pacco `consegna-*`: il pubblicatore li raccoglie tutti ed e' l'unico
        # a scrivere. E' la stessa correzione gia' fatta per l'insieme e per i raccoglitori.
        if: always()
        run: |
          # SOLO I FILE CAMBIATI (29/09). Consegnare tutta `data` vorrebbe dire spedire il
          # repository intero a ogni giro: gigabyte di roba gia' su GitHub, per salvare qualche
          # decina di file nuovi. Si mette da parte solo cio' che questa corsia ha toccato.
          rm -rf /tmp/consegna && mkdir -p /tmp/consegna
          # UN FILE CANCELLATO NON DEVE UCCIDERE LA CONSEGNA (2/10). `git status` elenca anche
          # i file CANCELLATI, e qui `[ -f "$F" ]` su uno di quelli e' falso: con `bash -e`,
          # che GitHub usa di default, il passo moriva lì. E' successo appena ho collegato la
          # fusione degli iniziatori, che cancella il file dei nuovi dopo averli uniti: 24.000
          # transazioni fuse correttamente e MAI consegnate, perche' il passo dopo e' morto su
          # un file che non c'era piu'.
          # Con `if`/`fi` invece di `&&` il caso normale non e' piu' un errore.
          git status --porcelain -- data | awk '{print $NF}' | while read F; do
            if [ -f "$F" ]; then
              mkdir -p "/tmp/consegna/$(dirname "$F")"
              cp "$F" "/tmp/consegna/$F"
            fi
          done
          N=$(find /tmp/consegna -type f | wc -l)
          echo "consegno $N file"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consegna-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}
          path: /tmp/consegna/data
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
      # IL RIARMO STA SOLO NEL LAVORO DEDICATO (30/09). Qui c'era anche, dentro un lavoro a
      # MATRICE: una chiamata per fetta, piu' quella del lavoro dedicato. La coda ne tiene
      # una e annulla le altre — tre cancellazioni su quattro, tutte finte, che coprivano
      # quelle vere. Un riarmo per corsia, non per fetta.
# SENZA RIARMO: il riarmo dormiva mezz'ora su una macchina prima di rilanciarsi, e una
# macchina che dorme occupa un posto come una che lavora. Misurato l'1/10 su tutte le corsie:
# 622 minuti-macchina a dormire per un giro di ognuna, il 52% della capacita' di venti macchine.
# Ed era un cerchio: il riarmo esisteva perche' GitHub salta gli orologi sui repository
# OCCUPATI, ed era proprio quel dormire a tenerlo occupato. Il rimedio alimentava la malattia.
# Qui il motore e' l'orologio ogni ora, e la rete e' la maglia di guardie — riparata l'1/10, e
# verificata la stessa sera: ha rimesso in moto quattro corsie davvero mute senza toccarne una
# sola di sane. Questa corsia e' sorvegliata con un limite di 90 minuti di silenzio.
# PRIMA DI PROPAGARE ALLE ALTRE DODICI: guardare per qualche ora che questa resti viva e NON
# giri di continuo. Vedi RIARMI_CHE_DORMONO.md.
