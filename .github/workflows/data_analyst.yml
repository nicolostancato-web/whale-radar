name: data_analyst
# DATA_ANALYST: analisi automatica del loop (livello 1). Ogni giorno mina i dati e scrive ANALYSIS.md
# con la materia prima per le prossime leve (feature forti, wallet smart-money, pattern dei mostri). €0.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "53 */6 * * *"
permissions:
  contents: write
concurrency:
  group: data_analyst
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python agents/data_analyst.py || echo "ko"
      - name: Salva
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add ANALYSIS.md 2>/dev/null || true
          git commit -m "data_analyst $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3; do git pull --no-rebase --no-edit -X ours origin main || true; git push origin main && exit 0; sleep 4; done
