name: whale-radar-paper
# PAPER TEST LIVE (out-of-sample). Gira ogni ora: cattura segnali freschi, simula la strategia
# scale-out, aggiorna P&L paper. NIENTE soldi reali. Dati 100% gratis (GeckoTerminal). Stato committato.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"   # ogni ora (minuto 17). Job leggero (~2-3 min). Ben dentro il free tier.

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Paper tracker (out-of-sample)
        run: python tracker.py || echo "tracker ko, riprovo al prossimo giro"
      - name: Salva stato paper
        run: |
          git config user.name "whale-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true   # stato paper + archivio snapshot compresso (accumulo forever)
          git commit -m "paper $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "niente di nuovo"; exit 0; }
          for i in 1 2 3; do
            git pull --no-rebase --no-edit -X ours origin main || true
            git push origin main && exit 0
            sleep 4
          done
          echo "push non riuscito, riprovo al prossimo giro"; exit 0
