name: paper_bot
# PAPER BOT: paper test in avanti della strategia coda-grassa (compra ogni memecoin +3h, TP 5x, trailing -60%).
# Soldi FINTI. Gira ogni 3h, gestisce posizioni, scrive PAPER.md. €0. Validazione onesta prima di soldi veri.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "50 */3 * * *"
permissions:
  contents: write
concurrency:
  group: paper_bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python agents/paper_bot.py || echo "ko, riprovo"
      - name: Salva
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/paper_bot_state.json data/paper_bot_ledger.jsonl.gz PAPER.md 2>/dev/null || true
          git commit -m "paper $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3; do
            git pull --no-rebase --no-edit -X ours origin main || true
            git push origin main && exit 0; sleep 4
          done
          exit 0
