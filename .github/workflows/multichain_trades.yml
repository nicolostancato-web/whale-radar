name: multichain_trades
# MULTICHAIN_TRADES: raccoglie i trade (buy/sell + wallet) per pool su 4 chain (matrix parallelo) via
# GeckoTerminal /trades. Da qui le feature FORTI: flow + first-buyers. Ogni 20 min. €0.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "25,55 * * * *"   # ogni 15min: i pool giovani fetchati piu volte nella prima ora = PUNTO-ZERO   # ogni ora (era 3x/ora): 1/3 dei minuti
permissions:
  contents: write
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chain: [solana, bsc, base, robinhood]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: mt-${{ matrix.chain }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Trade ${{ matrix.chain }}
        env: { CHAIN: "${{ matrix.chain }}" }
        run: python agents/multichain_trades.py || echo "ko"
      - name: Salva
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/multichain/${{ matrix.chain }}/trades data/multichain/${{ matrix.chain }}/trades_ckpt.json 2>/dev/null || true
          git commit -m "trades ${{ matrix.chain }} $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3 4 5 6; do
            git pull --no-rebase --no-edit -X ours origin main || true
            git push origin main && { echo pushed; exit 0; }
            sleep $((RANDOM % 8 + 3))
          done
          exit 0
