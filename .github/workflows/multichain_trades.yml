name: multichain_trades
# A RIPOSO DAL 30/09. Ultimo giro il 26-27 agosto: si e' fermata quando il progetto ha cambiato
# direzione, e in trentaquattro giorni nessuno se n'e' accorto. Una corsia che fallisce manda una
# email; una che smette di esistere non manda niente — ed e' il guasto piu' silenzioso di tutti.
#
# NON e' cancellata: il codice resta e si lancia a mano da GitHub quando serve. Spento solo
# l'orologio, perche' una corsia che nessuno legge consuma uno dei venti posti macchina e produce
# rumore nei registri — e il rumore nasconde i guasti veri.
# SENZA RIARMO: raccoglie a ritmo suo, senza arretrato. Le macchine gratis in parallelo sono venti e il
# 25/09 il riarmo su troppe corsie ha affamato quelle critiche: qui l'orologio basta.
# MULTICHAIN_TRADES: raccoglie i trade (buy/sell + wallet) per pool su 4 chain (matrix parallelo) via
# GeckoTerminal /trades. Da qui le feature FORTI: flow + first-buyers. Ogni 20 min. €0.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chain: [solana, bsc, base, robinhood]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: mt-${{ matrix.chain }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Trade ${{ matrix.chain }}
        env: { CHAIN: "${{ matrix.chain }}" }
        run: python agents/multichain_trades.py || echo "ko"
      - name: Salva
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/multichain/${{ matrix.chain }}/trades data/multichain/${{ matrix.chain }}/trades_ckpt.json 2>/dev/null || true
          git commit -m "trades ${{ matrix.chain }} $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3 4 5 6; do
            { git fetch --deepen 50 -q origin main 2>/dev/null || true; git pull --rebase --autostash -q origin main || git pull --no-rebase --no-edit --allow-unrelated-histories -X ours origin main; } || true
            git push origin main && { echo pushed; exit 0; }
            sleep $((RANDOM % 8 + 3))
          done
          exit 0
