name: watchdog_quality
# A RIPOSO DAL 30/09. Non gira dal 27 agosto — trentaquattro giorni — e nessuno se n'e' accorto:
# la qualita' la controllano sentinella e i controlli dentro pubblica.sh.
# Stavo per rianimarla aggiungendole il riarmo, prima di chiedermi se serviva ancora. Non serve.
#
# NON e' cancellata: il codice resta e si lancia a mano da GitHub quando serve. Spento solo
# l'orologio, perche' una corsia che gira senza che nessuno legga il suo risultato consuma uno dei
# venti posti macchina e produce rumore nei registri — e il rumore nasconde i guasti veri.
# WATCHDOG: controlla che l'accumulo sia sano (integrita', freschezza, copertura) e scrive HEALTH.md.
# Se qualcosa e' rotto esce con errore -> GitHub manda una MAIL di alert al proprietario. Ogni 3h. €0.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: watchdog_quality
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Salva HEALTH.md (sempre, anche se il check fallisce)
        run: |
          python agents/watchdog_quality.py && echo "EXIT=0" > /tmp/wd_exit || echo "EXIT=1" > /tmp/wd_exit
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add HEALTH.md data/health_snapshot.json 2>/dev/null || true
          git commit -m "health $(date -u +%Y-%m-%dT%H:%MZ)" || echo "niente da committare"
          for i in 1 2 3; do
            { git fetch --deepen 50 -q origin main 2>/dev/null || true; git pull --rebase --autostash -q origin main || git pull --no-rebase --no-edit --allow-unrelated-histories -X ours origin main; } || true
            git push origin main && break; sleep 4
          done
      - name: Fallisci (manda alert mail) se l'accumulo e' malato
        run: test "$(cat /tmp/wd_exit)" = "EXIT=0"
