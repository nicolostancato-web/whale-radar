name: watchdog_quality
# WATCHDOG: controlla che l'accumulo sia sano (integrita', freschezza, copertura) e scrive HEALTH.md.
# Se qualcosa e' rotto esce con errore -> GitHub manda una MAIL di alert al proprietario. Ogni 3h. €0.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "50 */3 * * *"   # ogni 3 ore, a :50 (dopo gli accumulatori)
permissions:
  contents: write
concurrency:
  group: watchdog_quality
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Salva HEALTH.md (sempre, anche se il check fallisce)
        run: |
          python agents/watchdog_quality.py && echo "EXIT=0" > /tmp/wd_exit || echo "EXIT=1" > /tmp/wd_exit
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add HEALTH.md data/health_snapshot.json 2>/dev/null || true
          git commit -m "health $(date -u +%Y-%m-%dT%H:%MZ)" || echo "niente da committare"
          for i in 1 2 3; do
            git pull --no-rebase --no-edit -X ours origin main || true
            git push origin main && break; sleep 4
          done
      - name: Fallisci (manda alert mail) se l'accumulo e' malato
        run: test "$(cat /tmp/wd_exit)" = "EXIT=0"
