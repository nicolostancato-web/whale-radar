name: supervisor
# A RIPOSO DAL 30/09. Ultimo giro il 26-27 agosto: si e' fermata quando il progetto ha cambiato
# direzione, e in trentaquattro giorni nessuno se n'e' accorto. Una corsia che fallisce manda una
# email; una che smette di esistere non manda niente — ed e' il guasto piu' silenzioso di tutti.
#
# NON e' cancellata: il codice resta e si lancia a mano da GitHub quando serve. Spento solo
# l'orologio, perche' una corsia che nessuno legge consuma uno dei venti posti macchina e produce
# rumore nei registri — e il rumore nasconde i guasti veri.
# SENZA RIARMO: e' un rapporto di supervisione periodico. Le macchine gratis in parallelo sono venti e il
# 25/09 il riarmo su troppe corsie ha affamato quelle critiche: qui l'orologio basta.
# GUARDIANO AUTO-RIPARANTE: ogni ora scopre TUTTI i reparti (anche i nuovi), controlla che girino, RI-LANCIA da
# solo quelli fermi/cancellati, manda mail se uno FALLISCE (bug). La macchina non si ferma. €0.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [whale_backfill, whale_candles, director, collector, wallet_scores, whale_enrich, wallet_forensics]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: supervisor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Guardiano
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WR_PAT: ${{ secrets.WR_PAT }}
        run: |
          python agents/supervisor.py && echo "EXIT=0" > /tmp/s_exit || echo "EXIT=1" > /tmp/s_exit
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add SUPERVISOR.md 2>/dev/null || true
          git commit -m "supervisor $(date -u +%Y-%m-%dT%H:%MZ)" || echo niente
          for i in 1 2 3; do
            { git fetch --deepen 50 -q origin main 2>/dev/null || true; git pull --rebase --autostash -q origin main || git pull --no-rebase --no-edit --allow-unrelated-histories -X ours origin main; } || true
            git push origin main && break; sleep 4
          done
      - name: Alert (mail) se un reparto fallisce
        run: test "$(cat /tmp/s_exit)" = "EXIT=0"
