name: hook
# CHI PUO' BLOCCARTI L'USCITA (24/09).
# Su Uniswap V4 un pool puo' impedire di vendere ANCHE avendo scambi veri da molti portafogli: il
# blocco non sta negli swap, sta nei permessi dell'hook, scritti nei bit bassi del suo indirizzo.
# Primo campione: il 43% dei pool V4 di base ha un hook che puo' toccare l'uscita.
# Il nostro controllo di vendibilita' vede solo chi non ha MAI venduto: questa famiglia gli sfugge.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

concurrency:
  group: hook
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  raccogli:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        chain: [base, robinhood]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Raccogli gli hook
        env:
          CHAIN: ${{ matrix.chain }}
          BUDGET_SEC: "1500"
        run: python agents/raccogli_hook.py

      - name: Salva
        if: always()
        run: |
          git config user.name "whale-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git commit -m "hook ${{ matrix.chain }} $(date -u +%H:%MZ)"; then
            echo "NIENTE DA SALVARE"; exit 0
          fi
          for i in $(seq 1 20); do
            git pull --no-rebase --no-edit -X ours origin main >/dev/null 2>&1 || true
            if git push origin main; then echo "spinto al tentativo $i"; exit 0; fi
            sleep $((RANDOM % 15 + 5 + i * 2))
          done
          echo "NON SONO RIUSCITO A SPINGERE: il prossimo giro rifara' questi pool."
          exit 1

  riarmo:
    needs: raccogli
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Riarmo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # RIARMO (25/09): GitHub salta i cron sui repository occupati. Stesso difetto trovato su
          # iniziatori.yml lo stesso giorno: due corsie nuove create senza il meccanismo che le
          # altre otto avevano dal 22/09.
          sleep 120
          for TENT in 1 2 3 4 5; do
            CODICE=$(curl -s -o /tmp/r.out -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hook.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$CODICE" = "204" ]; then echo "riarmata (tentativo $TENT)"; exit 0; fi
            echo "riarmo respinto (HTTP $CODICE), tentativo $TENT"
            case "$CODICE" in
              5*|429|000) sleep $((TENT * 15)) ;;
              *) echo "rifiuto definitivo"; cat /tmp/r.out; exit 1 ;;
            esac
          done
          echo "NON SONO RIUSCITO A RIARMARMI dopo 5 tentativi"; exit 1
