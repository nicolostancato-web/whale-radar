name: wallet_scores
# REPARTO WALLET_SCORES: ricalcola il track-record VIVO di ogni wallet-balena (dato derivato).
# Nessuna chiamata esterna, solo calcolo sui nostri dati -> flag DUMB (evitare) / WATCH (smart da confermare).
# Ogni 4h, dopo gli accumulatori. Commit data/wallet_scores.json. €0.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "39 */6 * * *"   # ogni 4 ore, a :08 (dopo backfill :18? no -> gira su dati gia' committati del giro prima)
permissions:
  contents: write
concurrency:
  group: wallet_scores
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python agents/wallet_scores.py || echo "ko, riprovo al prossimo giro"
      - name: Salva scoreboard
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/wallet_scores.json 2>/dev/null || true
          git commit -m "wallet_scores $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3; do
            git pull --no-rebase --no-edit -X ours origin main || true
            git push origin main && exit 0; sleep 4
          done
          exit 0
