name: insider
on:
  workflow_dispatch:        # solo manuale: nel giro normale gira DENTRO il motore (niente cron doppioni)
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python agents/wallet_insider.py
        env: {CHAIN: solana}
      - run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -m "insider $(date -u +%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --no-rebase --no-edit -X ours origin main; git push origin main && break; sleep 4; done
