name: strategy_optimizer_solana
# A RIPOSO DAL 30/09. Ultimo giro il 26-27 agosto: si e' fermata quando il progetto ha cambiato
# direzione, e in trentaquattro giorni nessuno se n'e' accorto. Una corsia che fallisce manda una
# email; una che smette di esistere non manda niente — ed e' il guasto piu' silenzioso di tutti.
#
# NON e' cancellata: il codice resta e si lancia a mano da GitHub quando serve. Spento solo
# l'orologio, perche' una corsia che nessuno legge consuma uno dei venti posti macchina e produce
# rumore nei registri — e il rumore nasconde i guasti veri.
# SENZA RIARMO: ottimizza una strategia non attiva, su una chain fuori dal lavoro attuale. Le macchine gratis in parallelo sono venti e il
# 25/09 il riarmo su troppe corsie ha affamato quelle critiche: qui l'orologio basta.
# Loop STRATEGIA dedicato a Solana: sweep TP/timing, adotta la migliore ROBUSTA in data/strategy_solana.json.
# Dispatch-only (nessun cron = zero peso). Gira anche dentro il MOTORE. €0.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Ottimizza strategia Solana
        env: { HELIUS_KEY: "${{ secrets.HELIUS_API }}" }
        run: python agents/strategy_optimizer_solana.py || echo ko
      - name: Salva
        run: |
          git config user.name bot; git config user.email bot@x.com
          git add data/strategy_solana.json 2>/dev/null || true
          git commit -m "strategy_solana $(date -u +%H:%MZ)" || exit 0
          for i in 1 2 3 4; do { git fetch --deepen 50 -q origin main 2>/dev/null || true; git pull --rebase --autostash -q origin main || git pull --no-rebase --no-edit --allow-unrelated-histories -X ours origin main; } || true; git push origin main && exit 0; sleep 3; done
