name: whale_enrich
# A RIPOSO DAL 30/09. Ultimo giro il 26-27 agosto: si e' fermata quando il progetto ha cambiato
# direzione, e in trentaquattro giorni nessuno se n'e' accorto. Una corsia che fallisce manda una
# email; una che smette di esistere non manda niente — ed e' il guasto piu' silenzioso di tutti.
#
# NON e' cancellata: il codice resta e si lancia a mano da GitHub quando serve. Spento solo
# l'orologio, perche' una corsia che nessuno legge consuma uno dei venti posti macchina e produce
# rumore nei registri — e il rumore nasconde i guasti veri.
# SENZA RIARMO: arricchimento per una fase non attiva, con budget di tempo per giro. Girare
# ogni tre ore e' il suo disegno, non una dimenticanza: riarmarsi occuperebbe un posto
# macchina in continuazione per un lavoro che nessuno sta aspettando.
# ARRICCHIMENTO: aggiunge a ogni balena (anche storica) le FEATURE-INSIDER (no-lookahead, precise) per la Fase 2.
# File immutabili, dedup, resumable, budget-tempo. Ogni 4h. €0.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: whale_enrich
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: ENRICH_SEC=950 python agents/whale_enrich.py || echo "ko, riprovo"
      - name: Salva
        run: |
          git config user.name "whale-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/raw/enriched data/enrich_checkpoint.json 2>/dev/null || true
          git commit -m "enrich $(date -u +%Y-%m-%dT%H:%MZ)" || { echo niente; exit 0; }
          for i in 1 2 3; do
            { git fetch --deepen 50 -q origin main 2>/dev/null || true; git pull --rebase --autostash -q origin main || git pull --no-rebase --no-edit --allow-unrelated-histories -X ours origin main; } || true
            git push origin main && exit 0; sleep 4
          done
          exit 0
